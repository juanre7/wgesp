name: flasher

# Compila el firmware y publica docs/ con el binario recien generado.
# El .bin no vive en el repo: se construye aqui en cada push a main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.5
    steps:
      - uses: actions/checkout@v4

      - name: Compilar y fusionar
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          idf.py build
          # ruta absoluta: merge-bin lanza esptool desde build/
          idf.py merge-bin -o "$GITHUB_WORKSPACE/docs/wgesp.bin"

      - name: Comprobar la imagen
        shell: bash
        run: |
          # cabecera de imagen ESP y un tamano que descarte un merge vacio
          head -c1 docs/wgesp.bin | od -An -tx1 | grep -q e9
          [ "$(stat -c%s docs/wgesp.bin)" -gt 500000 ]

      - name: Que la imagen publica no lleve credenciales
        shell: bash
        run: |
          # El firmware compila las credenciales dentro del binario. Una build
          # con sdkconfig.local se publicaria con la clave privada de WireGuard
          # y la contrasena del WiFi legibles con 'strings'. Ya paso una vez.
          set -o pipefail
          fallo=0

          # 1. la configuracion efectiva: cubre cualquier valor, tambien el WiFi
          for sym in WGESP_PRIVATE_KEY WGESP_PRESHARED_KEY EXAMPLE_WIFI_SSID EXAMPLE_WIFI_PASSWORD; do
            valor=$(sed -n "s/^CONFIG_${sym}=\"\(.*\)\"$/\1/p" sdkconfig)
            if [ -n "$valor" ]; then
              echo "::error::CONFIG_${sym} no esta vacio: la imagen publica llevaria credenciales"
              fallo=1
            fi
          done

          # 2. red de seguridad sobre el binario: nada con forma de clave WG
          if strings -n 44 docs/wgesp.bin | grep -qE '[A-Za-z0-9+/]{43}='; then
            echo "::error::el binario contiene una cadena con forma de clave WireGuard"
            fallo=1
          fi

          [ "$fallo" = 0 ] || exit 1
          echo "Imagen limpia."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
